name: Container image

# Builds the web app's container image for linux/amd64 and linux/arm64, and
# publishes it to GitHub Packages (GHCR) as ghcr.io/<owner>/standup-web.
#
# Each architecture is built on a runner of that architecture, so nothing is
# emulated. The two images are pushed by digest, and a final job combines them
# into one multi-platform image (a manifest list) and tags it.
#
# Pull requests build the image to check that it builds, but do not publish it.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "src/web/**"
      - ".github/workflows/container.yml"

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: standup-web

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      # Image names must be lowercase. The platform name is also used in file names.
      - name: Prepare
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Packages
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The labels include org.opencontainers.image.source, which links the
      # package to this repository.
      - name: Compute the image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      # The image is pushed by digest, without a tag. The merge job tags it.
      # Provenance is attested on the combined image in the merge job, because
      # per-platform attestations would make the combined image an index of indexes.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: src/web
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=web-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=web-${{ env.PLATFORM_PAIR }},mode=max
          provenance: false
          sbom: false

      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish the multi-platform image
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Prepare
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<commit> for every build, the branch name, the version and its major
      # and minor parts for v1.2.3 tags, and "latest" for the default branch.
      - name: Compute the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect the image
        id: inspect
        run: |
          tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$tag"
          digest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Container image"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Digest: \`${digest}\`"
            echo "- Tags:"
            jq -r '.tags[] | "  - `" + . + "`"' <<< "$DOCKER_METADATA_OUTPUT_JSON"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
